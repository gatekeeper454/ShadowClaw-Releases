name: Sign and finalize release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved version, without v'
        required: true
        type: string
      manifest_sha256:
        description: 'Locally reviewed release-manifest.json SHA-256'
        required: true
        type: string
      publish:
        description: 'Publish after signing and verification (otherwise keep draft)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-distribution
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'gatekeeper454/ShadowClaw-Releases' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v${{ inputs.version }}
      APPROVED_MANIFEST: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Verify approved draft and exact inventory
        id: intake
        run: python tools/release.py download --tag "$RELEASE_TAG" --out incoming --expected "$APPROVED_MANIFEST"
      - name: Require managed Windows signing configuration
        if: steps.intake.outputs.windows == 'true'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
          WINDOWS_PUBLISHER_SUBJECT: ${{ vars.WINDOWS_PUBLISHER_SUBJECT }}
        run: |
          foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID',
            'SIGNING_ENDPOINT', 'SIGNING_ACCOUNT', 'SIGNING_PROFILE', 'WINDOWS_PUBLISHER_SUBJECT')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Configure the release environment variable $name before Windows signing"
            }
          }
          if ($env:SIGNING_ENDPOINT -notmatch '^https://[a-z0-9-]+\.codesigning\.azure\.net/?$') {
            throw 'Use the official regional Artifact Signing HTTPS endpoint'
          }
      - name: Unpack Windows files without executing them
        if: steps.intake.outputs.windows == 'true'
        run: python tools/release.py windows-unpack --directory incoming --out signing
      - name: Authenticate to Azure using this environment identity
        if: steps.intake.outputs.windows == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Apply Authenticode and RFC 3161 timestamps
        if: steps.intake.outputs.windows == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\signing
          files-folder-filter: exe,dll,msi,ps1,psm1,psd1
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify Windows trust, publisher, timestamp and every target
        if: steps.intake.outputs.windows == 'true'
        shell: pwsh
        env:
          EXPECTED_SUBJECT: ${{ vars.WINDOWS_PUBLISHER_SUBJECT }}
        run: ./tools/verify-windows.ps1 -Directory signing -ExpectedSubject $env:EXPECTED_SUBJECT -Report windows-signatures.json
      - name: Repack verified Windows bytes and regenerate final inventory
        if: steps.intake.outputs.windows == 'true'
        run: python tools/release.py windows-pack --directory incoming --signing signing --report windows-signatures.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign the final distribution inventory with GitHub OIDC
        run: cosign sign-blob --yes --bundle incoming/SHA256SUMS.sigstore.json incoming/SHA256SUMS
      - name: Upload verified signed files; optionally publish immutable release
        env:
          PUBLISH_RELEASE: ${{ inputs.publish }}
        run: |
          publish=()
          if [[ "$PUBLISH_RELEASE" == true ]]; then publish+=(--publish); fi
          python tools/release.py upload-final --tag "$RELEASE_TAG" --directory incoming --expected "$APPROVED_MANIFEST" "${publish[@]}"
