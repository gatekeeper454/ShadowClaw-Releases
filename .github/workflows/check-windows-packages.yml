name: Check combined Windows packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Approved candidate version, without v'
        required: true
        type: string
      manifest_sha256:
        description: 'Reviewed draft release-manifest.json SHA-256'
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'gatekeeper454/ShadowClaw-Releases' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      # GitHub draft releases require write-capable access even for retrieval.
      # This job verifies/transfers data and never executes product code.
      contents: write
    outputs:
      inventory: ${{ steps.inventory.outputs.sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v${{ inputs.version }}
      APPROVED_MANIFEST: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Verify the finalized draft and production checksum signer
        run: python tools/release.py download-validation --tag "$RELEASE_TAG" --out incoming --expected "$APPROVED_MANIFEST"
      - name: Bind the authenticated inventory to native test jobs
        id: inventory
        shell: python
        run: |
          import hashlib, os
          from pathlib import Path
          value=hashlib.sha256(Path('incoming/SHA256SUMS').read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as stream:
              stream.write('sha256='+value+'\n')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-native-candidate
          path: incoming/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  native:
    needs: prepare
    if: github.repository == 'gatekeeper454/ShadowClaw-Releases' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-2022
          - platform: windows-arm64
            runner: windows-11-arm
    name: Native combined installer (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    env:
      APPROVED_MANIFEST: ${{ inputs.manifest_sha256 }}
      AUTHENTICATED_INVENTORY: ${{ needs.prepare.outputs.inventory }}
      PACKAGE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-native-candidate
          path: incoming
          digest-mismatch: error
      - name: Recheck transferred bytes against the authenticated inventory
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          sys.path.insert(0,str(Path('tools').resolve()))
          import release
          release.verify(Path('incoming'),os.environ['APPROVED_MANIFEST'])
          if release.digest(Path('incoming/SHA256SUMS'))!=os.environ['AUTHENTICATED_INVENTORY']:
              raise SystemExit('Transferred inventory does not match verified production signature')
      - name: Select the validated archive for this native architecture
        shell: python
        run: |
          import json, os
          from pathlib import Path
          value=json.loads(Path('incoming/release-manifest.json').read_text())
          matches=[a for a in value['assets'] if a['platform']==os.environ['PACKAGE_PLATFORM'] and a['role']=='package' and a['name'].endswith('.msi')]
          if len(matches)!=1: raise SystemExit('Require exactly one full MSI per target')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as stream:
              stream.write('PACKAGE_ARCHIVE='+str(Path('incoming',matches[0]['name']).resolve())+'\n')
          print('Approved package SHA-256:',matches[0]['sha256'])
      - name: Exercise the combined installer only on this disposable runner
        shell: pwsh
        run: |
          ./tools/check-windows-msi.ps1 -PackagePath $env:PACKAGE_ARCHIVE
