name: Validate release tooling
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    name: Validate release tooling (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - name: Parse PowerShell without executing uploaded content
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          foreach ($path in @('tools/verify-windows.ps1','tools/check-windows-package.ps1','tools/check-windows-msi.ps1','tools/normalize-windows-msi.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              "$pwd/$path", [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw 'PowerShell parse failed' }
          }
      - name: Check native MSI database authoring on a synthetic fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/check-native-msi-metadata.ps1
